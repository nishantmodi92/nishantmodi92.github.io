<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nishant Modi — Senior Android Engineer</title>
  <!-- NEW: Analytics + SEO -->
  <script defer src="https://plausible.io/js/script.js" data-domain="nishantmodi92.github.io"></script>
  <meta property="og:title" content="Nishant Modi — Senior Android Engineer" />
  <meta property="og:description" content="High-performance Android engineering with real-time, offline-first, and multi-module expertise." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* Same styling + new animations + search bar + chatbot bubble */
    :root{
      --bg:linear-gradient(180deg,#060b18,#070d20);
      --card:rgba(255,255,255,0.05);
      --accent:#4dd0ff;
      --text:#e9eef9;
    }
    body{margin:0;font-family:Inter;background:var(--bg);color:var(--text)}
    .card{background:var(--card);padding:20px;border-radius:14px;margin:20px 0;border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(8px);}

    /* Background animation */
    #bgCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1}

    /* Search bar */
    #searchBar{width:100%;padding:12px;border-radius:12px;border:none;margin:12px 0;background:#0f172a;color:#fff;font-size:16px}

    /* Chatbot */
    #chatbotBubble{position:fixed;right:20px;bottom:20px;background:#4dd0ff;color:#000;padding:14px 18px;border-radius:50px;cursor:pointer;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,0.3)}
    #chatWindow{display:none;position:fixed;right:20px;bottom:80px;width:320px;background:#ffffff;border-radius:16px;color:#000;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,0.4)}
    #chatLog{height:260px;overflow-y:auto;margin-bottom:10px;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:14px}
    #chatInput{width:100%;padding:10px;border-radius:10px;border:1px solid #ccc}

    /* High-res diagrams */
    .diagram svg{width:100%;height:auto}
  </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="container" style="max-width:1200px;margin:auto;padding:20px">

  <!-- Search Bar -->
  <input id="searchBar" placeholder="Search projects, skills, experience..." />

  <section class="card">
    <h2>High‑Resolution Architecture Diagrams</h2>
    <div class="diagram">
      <svg viewBox="0 0 900 300">
        <defs>
          <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4dd0ff" />
            <stop offset="100%" stop-color="#7c4dff" />
          </linearGradient>
        </defs>
        <rect x="40" y="60" width="200" height="80" rx="12" fill="url(#grad1)" opacity="0.85" />
        <text x="90" y="110" fill="#000" font-size="20" font-weight="700">Android App</text>
        <line x1="240" y1="100" x2="430" y2="100" stroke="#4dd0ff" stroke-width="4" />
        <rect x="430" y="60" width="200" height="80" rx="12" fill="#1e293b" stroke="#7c4dff" stroke-width="3" />
        <text x="470" y="110" fill="#fff" font-size="20" font-weight="700">Sync Gateway</text>
        <line x1="630" y1="100" x2="820" y2="100" stroke="#4dd0ff" stroke-width="4" />
        <rect x="820" y="60" width="200" height="80" rx="12" fill="#0a192f" stroke="#4dd0ff" stroke-width="3" />
        <text x="850" y="110" fill="#fff" font-size="20" font-weight="700">Firestore / Realtime DB</text>
      </svg>
    </div>
  </section>

  <!-- EmailJS Contact Form -->
  <section class="card">
    <h2>Contact Me</h2>
    <form id="contactForm">
      <input type="text" id="name" placeholder="Your Name" required />
      <input type="email" id="email" placeholder="Email" required />
      <textarea id="message" placeholder="Message" rows="4" required></textarea>
      <button type="submit" style="padding:10px 20px;border-radius:10px;border:none;background:var(--accent);color:#000;font-weight:700">Send</button>
      <p id="formStatus" style="margin-top:10px"></p>
    </form>
  </section>

  <!-- Chatbot -->
  <div id="chatbotBubble">AI</div>
  <div id="chatWindow">
    <div id="chatLog"></div>
    <input id="chatInput" placeholder="Ask me anything..." />
  </div>

</div>

<script>
/******************************
 * PARTICLE BACKGROUND
 ******************************/
const canvas=document.getElementById('bgCanvas');const ctx=canvas.getContext('2d');canvas.width=innerWidth;canvas.height=innerHeight;let particles=[];
for(let i=0;i<80;i++){particles.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-0.5)*0.8,vy:(Math.random()-0.5)*0.8})}
function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#4dd0ff';particles.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,2,0,2*Math.PI);ctx.fill();p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>innerWidth)p.vx*=-1;if(p.y<0||p.y>innerHeight)p.vy*=-1});requestAnimationFrame(animate)}animate();

/******************************
 * SEARCH BAR (filters text globally)
 ******************************/
document.getElementById('searchBar').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase();
  document.querySelectorAll('.card').forEach(card=>{
    card.style.display=card.innerText.toLowerCase().includes(q)?'block':'none';
  });
});

/******************************
 * CHATBOT (local AI simulation)
 ******************************/
const bubble=document.getElementById('chatbotBubble');const win=document.getElementById('chatWindow');const log=document.getElementById('chatLog');const input=document.getElementById('chatInput');
bubble.onclick=()=>{win.style.display=win.style.display==='block'?'none':'block'}
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const txt=input.value.trim();if(!txt)return;
    log.innerHTML+=`<div><strong>You:</strong> ${txt}</div>`;
    input.value='';
    setTimeout(()=>{
      log.innerHTML+=`<div><strong>AI:</strong> I can help you explore projects, skills, or experience. Ask anything!</div>`;
      log.scrollTop=log.scrollHeight;
    },500);
  }
});

/******************************
 * EMAILJS Integration
 ******************************/
const form=document.getElementById('contactForm');
form.addEventListener('submit',e=>{
  e.preventDefault();
  document.getElementById('formStatus').innerText='Sending...';

  fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    service_id:"YOUR_EMAILJS_SERVICE_ID",
    template_id:"YOUR_TEMPLATE_ID",
    user_id:"YOUR_USER_ID",
    template_params:{name:form.name?.value,email:form.email?.value,message:form.message?.value}
  })}).then(r=>{
    if(r.ok)document.getElementById('formStatus').innerText='Message sent successfully!';
    else document.getElementById('formStatus').innerText='Failed to send message.';
  }).catch(()=>document.getElementById('formStatus').innerText='Error: Check console');
});
</script>

  <!-- AI Chatbot (OpenAI API Ready) -->
  <script>
    // Floating chatbot
    const botBtn = document.createElement('div');
    botBtn.id = 'chatbotButton';
    botBtn.textContent = '🤖';
    Object.assign(botBtn.style, {position:'fixed',right:'22px',bottom:'22px',background:'var(--accent)',color:'#000',padding:'14px',borderRadius:'50%',cursor:'pointer',fontSize:'22px',boxShadow:'0 4px 14px rgba(0,0,0,0.4)',zIndex:'999'});
    document.body.appendChild(botBtn);

    const chatBox = document.createElement('div');
    chatBox.id = 'chatWindow';
    Object.assign(chatBox.style,{position:'fixed',right:'22px',bottom:'90px',width:'320px',height:'420px',background:'var(--card-bg)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'12px',backdropFilter:'blur(8px)',display:'none',flexDirection:'column',zIndex:'999'});

    chatBox.innerHTML = `
      <div style="padding:12px;border-bottom:1px solid rgba(255,255,255,0.08);font-weight:700">Chat Assistant</div>
      <div id="chatMessages" style="flex:1;overflow:auto;padding:12px;font-size:14px"></div>
      <div style="padding:8px;display:flex;gap:6px">
        <input id="chatInput" placeholder="Ask me..." style="flex:1;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.1)" />
        <button id="chatSend" style="padding:8px 12px;border-radius:8px;background:var(--accent);color:#000;font-weight:700">Send</button>
      </div>`;
    document.body.appendChild(chatBox);

    botBtn.onclick=()=>{chatBox.style.display = chatBox.style.display==='none'?'flex':'none'};

    document.getElementById('chatSend').onclick=()=>{
      const input=document.getElementById('chatInput');
      const text=input.value.trim();
      if(!text)return;
      const msgBox=document.getElementById('chatMessages');
      msgBox.innerHTML+=`<div style='margin-bottom:8px'><strong>You:</strong> ${text}</div>`;
      input.value='';
      msgBox.scrollTop=msgBox.scrollHeight;

      setTimeout(()=>{
        msgBox.innerHTML+=`<div style='margin-bottom:8px;color:var(--accent)'><strong>AI:</strong> I will answer your query soon. (API Ready)</div>`;
        msgBox.scrollTop=msgBox.scrollHeight;
      },600);
    };
  </script>


  <!-- NEXT-UPGRADE SCRIPTS: Themes, OpenAI backend placeholder, Lottie, Voice Chat, Slideshow, Interactive Resume Tabs, GSAP scroll animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.9.6/lottie.min.js"></script>
  <script>
    /*******************************
     * 1) ADD 4 NEW THEMES
     *******************************/
    (function(){
      const extraThemes = {
        'gold':{bg:['#0b0b0b','#1a0f00'],card:'rgba(255,255,255,0.03)',accent:'#d4af37',text:'#f4f1ec'},
        'sunset2':{bg:['#ff6a88','#ffb86b'],card:'rgba(255,255,255,0.08)',accent:'#ff6a3d',text:'#111'},
        'cyberpunk2':{bg:['#060018','#2b005b'],card:'rgba(255,255,255,0.06)',accent:'#ff2d95',text:'#fff'},
        'emerald2':{bg:['#012b26','#034d45'],card:'rgba(255,255,255,0.04)',accent:'#10b981',text:'#e6f7f0'}
      };
      // merge with existing theme engine if present
      try{
        window._nm_theme_pool = Object.assign(window._nm_theme_pool || {}, extraThemes);
      }catch(e){window._nm_theme_pool=extraThemes}
      // expose quick apply
      window.addNewTheme = function(name){if(window._nm_theme_pool && window._nm_theme_pool[name]){const t=window._nm_theme_pool[name];document.documentElement.style.setProperty('--bg',`linear-gradient(180deg,${t.bg[0]},${t.bg[1]})`);document.documentElement.style.setProperty('--card-bg',t.card);document.documentElement.style.setProperty('--accent',t.accent);document.documentElement.style.setProperty('--text',t.text);localStorage.setItem('nm-theme',name)}}
    })();

    /*******************************
     * 2) FULL OPENAI GPT-POWERED BACKEND (PLACEHOLDER + INSTRUCTIONS)
     *******************************/
    // NOTE: For production you must host a small server that holds your OpenAI API key securely.
    // Below is a client-side placeholder showing how to call a server endpoint: /api/openai
    async function callOpenAIAssistant(prompt){
      // Replace with your backend endpoint that forwards request to OpenAI securely
      const endpoint = '/api/openai';
      try{
        const res = await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});
        if(!res.ok)throw new Error('OpenAI proxy error');
        const j=await res.json();
        return j.reply || JSON.stringify(j);
      }catch(err){console.error(err);return 'AI backend not configured. Follow docs to add server-side OpenAI proxy.'}
    }

    // Wire chatbot send to OpenAI backend when available
    (function(){
      const sendBtn = document.getElementById('chatSend');
      if(sendBtn){
        sendBtn.addEventListener('click', async ()=>{
          const inputEl = document.getElementById('chatInput');
          const text = inputEl.value.trim(); if(!text) return;
          const msgs = document.getElementById('chatMessages'); msgs.innerHTML+=`<div style='margin-bottom:8px'><strong>You:</strong> ${text}</div>`; msgs.scrollTop=msgs.scrollHeight; inputEl.value='';
          msgs.innerHTML+=`<div style='margin-bottom:8px;color:var(--accent)'><strong>AI:</strong> Thinking…</div>`; msgs.scrollTop=msgs.scrollHeight;
          const reply = await callOpenAIAssistant(text);
          msgs.innerHTML = msgs.innerHTML.replace(/Thinking…<\/div>$/,'');
          msgs.innerHTML+=`<div style='margin-bottom:8px;color:var(--accent)'><strong>AI:</strong> ${reply}</div>`; msgs.scrollTop=msgs.scrollHeight;
        });
      }
    })();

    /*******************************
     * 3) LOTTIE ANIMATION ON HERO
     *******************************/
    (function(){
      const hero = document.querySelector('.hero');
      if(!hero) return;
      const container = document.createElement('div');
      container.style.width='240px'; container.style.height='240px'; container.style.position='absolute'; container.style.right='32px'; container.style.top='24px'; container.style.zIndex='2';
      hero.appendChild(container);
      // lightweight sample animation, replace 'path' with your Lottie JSON URL for production
      lottie.loadAnimation({container,renderer:'svg',loop:true,autoplay:true,animationData: {
        "v":"5.5.7","fr":30,"ip":0,"op":60,"w":200,"h":200,"nm":"dot-pulse","ddd":0,"assets":[],"layers":[{"ty":4,"shapes":[{"ty":"rc","s":{"k":[200,200]},"p":{"k":[100,100]},"r":{"k":40},"nm":"rect"},{"ty":"el","p":{"k":[100,100]},"s":{"k":[120,120]},"nm":"circle"}],"nm":"shape"}],"markers":[]}
      }});
    })();

    /*******************************
     * 4) VOICE-BASED CHATBOT (Web Speech API)
     *******************************/
    (function(){
      const micBtn = document.createElement('button'); micBtn.textContent='🎙️';
      Object.assign(micBtn.style,{position:'fixed',right:'90px',bottom:'22px',padding:'10px',borderRadius:'12px',zIndex:999,border:'none',background:'rgba(255,255,255,0.12)'});
      document.body.appendChild(micBtn);
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(!SpeechRecognition) { micBtn.title='Voice not supported'; return; }
      const recog = new SpeechRecognition(); recog.lang='en-US'; recog.interimResults=false; recog.maxAlternatives=1;
      micBtn.onclick=()=>{try{recog.start(); micBtn.textContent='🔴';}catch(e){console.error(e)}}
      recog.onresult = (ev)=>{const text = ev.results[0][0].transcript;const input=document.getElementById('chatInput'); input.value=text; document.getElementById('chatSend').click(); micBtn.textContent='🎙️'}
      recog.onend=()=>{micBtn.textContent='🎙️'}
    })();

    /*******************************
     * 5) AUTO PROJECT SLIDESHOW
     *******************************/
    (function(){
      const grid = document.getElementById('projectsGrid'); if(!grid) return; const items=[...grid.querySelectorAll('.project')]; let idx=0; function show(i){items.forEach((it,j)=>{it.style.display=(j>=i && j<i+3)?'block':'none'})}
      show(0); setInterval(()=>{idx=(idx+1)%Math.max(1,items.length); show(idx)},4000);
    })();

    /*******************************
     * 6) INTERACTIVE RESUME TABS
     *******************************/
    (function(){
      const resume = document.getElementById('resumeContent'); if(!resume) return;
      const tabs = document.createElement('div'); tabs.style.display='flex'; tabs.style.gap='8px'; tabs.style.marginBottom='12px';
      ['Summary','Projects','Experience','Education'].forEach((t,i)=>{const b=document.createElement('button');b.textContent=t; b.style.padding='8px 12px'; b.style.borderRadius='8px'; b.style.border='1px solid rgba(255,255,255,0.06)'; b.onclick=()=>{Array.from(resume.children).forEach((c,ci)=>c.style.display=(ci===i||i===0)?'block':'none')}; tabs.appendChild(b)});
      resume.prepend(tabs);
    })();

    /*******************************
     * 7) GSAP SCROLL-TRIGGER ANIMATIONS
     *******************************/
    (function(){
      if(window.gsap && window.ScrollTrigger){
        gsap.registerPlugin(ScrollTrigger);
        gsap.utils.toArray('.card').forEach(card=>{
          gsap.from(card,{y:30,opacity:0,duration:0.8,scrollTrigger:{trigger:card,start:'top 85%'}})
        })
        gsap.from('.hero h1',{y:20,opacity:0,duration:0.8,delay:0.2});
      }
    })();
  </script>
</body>
</html>
